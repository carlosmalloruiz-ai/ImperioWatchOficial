name: Actualizar catálogo del asesor

on:
  push:
    branches: [main]            # cámbialo a master si tu rama se llama así
    paths:
      - 'js/productos.js'
      - 'js/asesor-datos.js'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generar-asesor.js
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asesor.json
          git diff --cached --quiet || (git commit -m "chore: actualizar data/asesor.json" && git push) 